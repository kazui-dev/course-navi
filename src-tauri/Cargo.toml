[package]
name = "course-navi"
version = "0.1.1"
description = "山吹履修ナビ"
authors = ["美輪和維"]
edition = "2021"

[lib]
name = "course_navi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true 
